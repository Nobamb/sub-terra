name: PR diff check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff-check:
    name: Git diff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whitespace and conflict markers
        # pull_request checks out the test merge. Its first parent is the base.
        run: git diff --check HEAD^1 HEAD
